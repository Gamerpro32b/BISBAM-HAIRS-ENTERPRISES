<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Bisbam Hairs</title>
  <meta name="description" content="Sign in or create your Bisbam Hairs account.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-card">

    <a href="index.html">
      <img src="assets/logo/logo.png" alt="Bisbam Hairs" class="auth-logo">
    </a>

    <h1 class="auth-title" id="authTitle">Welcome Back</h1>
    <p class="auth-subtitle" id="authSubtitle">Sign in to your Bisbam Hairs account</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLogin">Sign In</button>
      <button type="button" class="auth-tab" id="tabSignup">Sign Up</button>
    </div>

    <!-- Email + Password -->
    <form id="authForm">

      <div class="form-group">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" name="email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" name="password" autocomplete="current-password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="authSubmitBtn">
        Sign In
      </button>

    </form>

    <p class="auth-footer-text" id="authToggleText">
      Don't have an account? <a href="#" id="authToggleLink">Sign up here</a>
    </p>

    <p class="auth-footer-text" id="forgotLinkWrap">
      <a href="#" id="forgotLink">Forgot password?</a>
    </p>

    <p class="auth-error" id="authError" hidden></p>
    <p class="auth-success" id="authSuccess" hidden></p>

    <p class="auth-trust">
      🔒 Always shop on <strong>www.bisbam.com</strong> — the official Bisbam Hairs website.
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
