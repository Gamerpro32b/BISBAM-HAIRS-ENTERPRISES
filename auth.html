<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Bisbam Hairs</title>
  <meta name="description" content="Sign in or create your Bisbam Hairs account.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-card">

    <a href="index.html">
      <img src="assets/logo/logo.png" alt="Bisbam Hairs" class="auth-logo">
    </a>

    <h1 class="auth-title" id="authTitle">Welcome Back</h1>
    <p class="auth-subtitle" id="authSubtitle">Sign in to your Bisbam Hairs account</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLogin">Sign In</button>
      <button type="button" class="auth-tab" id="tabSignup">Sign Up</button>
    </div>

    <!-- Google Button -->
    <button type="button" class="auth-google-btn" id="googleBtn">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
        <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
        <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
        <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">or</div>

    <!-- Email + Password -->
    <form id="authForm">

      <div class="form-group">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" name="email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" name="password" autocomplete="current-password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="authSubmitBtn">
        Sign In
      </button>

    </form>

    <p class="auth-footer-text" id="authToggleText">
      Don't have an account? <a href="#" id="authToggleLink">Sign up here</a>
    </p>

    <p class="auth-footer-text" id="forgotLinkWrap">
      <a href="#" id="forgotLink">Forgot password?</a>
    </p>

    <p class="auth-error" id="authError" hidden></p>
    <p class="auth-success" id="authSuccess" hidden></p>

    <p class="auth-trust">
      🔒 Always shop on <strong>www.bisbam.com</strong> — the official Bisbam Hairs website.
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
