<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Status — Bisbam Hairs</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ============ PAGE-SPECIFIC ============ */
    .success-body {
      min-height: 100vh;
      background: linear-gradient(135deg, #FDF5F9 0%, #FFFFFF 45%, #FDF5F9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
      position: relative;
      overflow: hidden;
    }

    .success-body::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 700px;
      height: 700px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(233, 30, 140, 0.12) 0%, transparent 65%);
      border-radius: 50%;
      pointer-events: none;
    }

    .success-heart {
      position: absolute;
      font-size: 22px;
      opacity: 0.35;
      color: var(--pink);
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }
    .success-heart:nth-child(1) { top: 12%; left: 8%; animation-delay: 0s; }
    .success-heart:nth-child(2) { top: 22%; right: 12%; animation-delay: 1.5s; font-size: 30px; }
    .success-heart:nth-child(3) { bottom: 18%; left: 14%; animation-delay: 3s; font-size: 18px; }
    .success-heart:nth-child(4) { bottom: 26%; right: 8%; animation-delay: 4.5s; }
    .success-heart:nth-child(5) { top: 42%; left: 4%; animation-delay: 2s; font-size: 14px; }
    .success-heart:nth-child(6) { top: 60%; right: 5%; animation-delay: 5.5s; font-size: 16px; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-22px) rotate(8deg); }
    }

    .success-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--pink-border);
      border-radius: var(--radius-md);
      padding: var(--space-2xl) var(--space-xl);
      text-align: center;
      box-shadow: 0 20px 60px rgba(233, 30, 140, 0.12);
      opacity: 0;
      transform: translateY(20px);
      animation: cardIn 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards;
    }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .success-loading {
      padding: var(--space-lg) 0;
      color: var(--grey);
      font-size: 0.9rem;
    }

    .success-eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: var(--space-md);
    }

    .success-title {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 5vw, 2.75rem);
      color: var(--black);
      margin-bottom: var(--space-sm);
      line-height: 1.1;
    }

    .success-script {
      font-family: var(--font-accent);
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      color: var(--pink);
      line-height: 1.2;
      margin-bottom: var(--space-lg);
    }

    .success-divider {
      width: 60px;
      height: 2px;
      background: var(--gradient-pink);
      margin: var(--space-md) auto var(--space-lg);
      border-radius: var(--radius-pill);
    }

    .success-order-box {
      display: inline-block;
      padding: 12px 22px;
      border: 1px dashed var(--pink);
      border-radius: var(--radius-sm);
      background: var(--pink-soft);
      margin-bottom: var(--space-lg);
    }

    .success-order-label {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 4px;
    }

    .success-order-number {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      color: var(--pink-deep);
      letter-spacing: 0.04em;
    }

    .success-message {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--grey);
      margin-bottom: var(--space-lg);
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    .success-message strong {
      color: var(--black);
      font-weight: 600;
    }

    .success-steps {
      text-align: left;
      background: var(--pink-soft);
      border-radius: var(--radius-sm);
      padding: var(--space-md) var(--space-lg);
      margin-bottom: var(--space-lg);
      list-style: none;
    }

    .success-steps li {
      position: relative;
      padding-left: 26px;
      font-size: 0.9rem;
      color: var(--black);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .success-steps li:last-child { margin-bottom: 0; }

    .success-steps li::before {
      content: '✦';
      position: absolute;
      left: 0;
      top: 0;
      color: var(--pink);
      font-size: 0.9rem;
    }

    .success-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-top: var(--space-lg);
    }

    .success-actions .btn { width: 100%; }

    .success-footer-note {
      margin-top: var(--space-lg);
      font-family: var(--font-accent);
      font-size: 1.25rem;
      color: var(--pink);
    }

    .success-trust-note {
      margin-top: var(--space-lg);
      padding-top: var(--space-md);
      border-top: 1px solid var(--pink-border);
      font-size: 0.8rem;
      color: var(--grey);
      text-align: center;
      line-height: 1.6;
    }

    .success-trust-note strong {
      color: var(--pink-deep);
      font-weight: 600;
    }

    .success-paid-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #ECFDF5;
      color: #16A34A;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .success-pending-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #FEF3C7;
      color: #92400E;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-md);
    }

    .success-paid-badge .dot {
      width: 8px;
      height: 8px;
      background: #16A34A;
      border-radius: 50%;
      animation: pulse-dot 1.6s ease-in-out infinite;
    }

    .success-pending-badge .dot {
      width: 8px;
      height: 8px;
      background: #92400E;
      border-radius: 50%;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .whatsapp-redirect-note {
      margin-top: var(--space-md);
      font-size: 0.82rem;
      color: var(--grey);
      text-align: center;
      display: none;
    }

    .whatsapp-redirect-note.is-visible { display: block; }

    .whatsapp-redirect-note strong { color: var(--pink); }

    .success-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--pink-border);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto var(--space-md);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="success-body">

  <span class="success-heart">♥</span>
  <span class="success-heart">♥</span>
  <span class="success-heart">♥</span>
  <span class="success-heart">♥</span>
  <span class="success-heart">♥</span>
  <span class="success-heart">♥</span>

  <div class="success-card" id="successCard">
    <div class="success-loading" id="loadingState">
      <div class="success-spinner"></div>
      Verifying your order…
    </div>
    <!-- Content injected by JS -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>

  <script>
    (function () {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const ref = params.get('ref');
      const orderNumber = params.get('order');

      const card = document.getElementById('successCard');
      const loading = document.getElementById('loadingState');

      function db() {
        if (!window.BisbamDB && window.initSupabase) window.initSupabase();
        return window.BisbamDB;
      }

      function naira(n) {
        return '₦' + Number(n || 0).toLocaleString('en-NG');
      }

      async function init() {
        // No order number → show generic page
        if (!orderNumber) {
          renderGeneric();
          return;
        }

        const client = db();
        if (!client) {
          renderError('Connection error. Please try again.');
          return;
        }

        // Wait a moment for Supabase to process URL tokens (if any)
        await new Promise(r => setTimeout(r, 300));

        try {
          const { data: order, error } = await client
            .from('orders')
            .select('*')
            .eq('order_number', orderNumber)
            .maybeSingle();

          if (error || !order) {
            renderNotFound();
            return;
          }

          const isPaid = order.payment_status === 'paid' || order.status === 'confirmed';

          if (isPaid) {
            renderPaid(order);
          } else {
            renderPending(order);
          }
        } catch (err) {
          console.warn('Order fetch error:', err);
          renderError('Could not load your order. Please try again.');
        }
      }

      /* ============ PAID ============ */
      function renderPaid(order) {
        const itemsHtml = (order.items || []).map(i => {
          const variant = [i.length && `${i.length}"`, i.texture, i.color, i.density]
            .filter(Boolean).join(' · ');
          return `
            <div style="padding:8px 0;border-bottom:1px solid #F2EDF0;font-size:0.88rem;text-align:left;">
              ${i.name} × ${i.qty}
              ${variant ? `<span style="display:block;font-size:0.75rem;color:var(--grey);">${variant}</span>` : ''}
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="success-paid-badge">
            <span class="dot"></span>
            Payment Received
          </div>

          <p class="success-eyebrow">Bisbam Hairs · Lagos</p>

          <h1 class="success-title">Payment Received</h1>
          <p class="success-script">Thank you, Bam Babe ♥</p>

          <div class="success-divider"></div>

          <div class="success-order-box">
            <span class="success-order-label">Order Number</span>
            <span class="success-order-number">${order.order_number}</span>
          </div>

          <p class="success-message">
            We've received your order. A member of our team will reach out shortly to
            <strong>confirm delivery details</strong>. Thank you for trusting Bisbam Hairs.
          </p>

          <ul class="success-steps">
            <li>We'll send you a WhatsApp confirmation.</li>
            <li>Delivery timeline depends on your location.</li>
            <li>Keep your phone reachable for updates.</li>
          </ul>

          <div class="success-actions">
            <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
            <a href="#" id="whatsappOrderBtn" class="btn btn-outline" target="_blank" rel="noopener">
              Tap here if WhatsApp didn't open
            </a>
          </div>

          <p class="whatsapp-redirect-note" id="whatsappNote">
            Opening WhatsApp in <strong id="countdown">4</strong>s for faster delivery…
          </p>

          <p class="success-footer-note">Good Hairs Attract Goodluck</p>

          <p class="success-trust-note">
            🔒 Always shop on <strong>www.bisbam.com</strong> — the official Bisbam Hairs website.
          </p>
        `;

        // Auto WhatsApp redirect
        startWhatsAppRedirect(order);
      }

      /* ============ PENDING / CANCELLED ============ */
      function renderPending(order) {
        card.innerHTML = `
          <div class="success-pending-badge">
            <span class="dot"></span>
            Payment Not Completed
          </div>

          <p class="success-eyebrow">Bisbam Hairs · Lagos</p>

          <h1 class="success-title">Payment Didn't Go Through</h1>
          <p class="success-script">Don't worry, Bam Babe</p>

          <div class="success-divider"></div>

          <div class="success-order-box">
            <span class="success-order-label">Your Order Reference</span>
            <span class="success-order-number">${order.order_number}</span>
          </div>

          <p class="success-message">
            Your payment wasn't completed, so your order is on hold.
            <strong>You can try again or message us for help.</strong>
          </p>

          <ul class="success-steps">
            <li>Your cart items are still saved.</li>
            <li>You can retry payment anytime.</li>
            <li>We're here on WhatsApp if you need help.</li>
          </ul>

          <div class="success-actions">
            <a href="checkout.html" class="btn btn-primary">Try Payment Again</a>
            <a href="https://wa.me/2348146108122?text=${encodeURIComponent('Hi Bisbam Hairs, I need help with order ' + order.order_number)}"
               class="btn btn-outline" target="_blank" rel="noopener">
              Message us on WhatsApp
            </a>
            <a href="shop.html" class="btn btn-outline">Continue Shopping</a>
          </div>

          <p class="success-footer-note">Good Hairs Attract Goodluck</p>

          <p class="success-trust-note">
            🔒 Always shop on <strong>www.bisbam.com</strong> — the official Bisbam Hairs website.
          </p>
        `;
      }

      /* ============ GENERIC (no order number) ============ */
      function renderGeneric() {
        card.innerHTML = `
          <p class="success-eyebrow">Bisbam Hairs · Lagos</p>
          <h1 class="success-title">Order Status</h1>
          <p class="success-script">Thank you, Bam Babe ♥</p>

          <div class="success-divider"></div>

          <p class="success-message">
            To view your order status, please enter your order number.
          </p>

          <div class="success-actions">
            <a href="track.html" class="btn btn-primary">Track Your Order</a>
            <a href="shop.html" class="btn btn-outline">Continue Shopping</a>
          </div>

          <p class="success-footer-note">Good Hairs Attract Goodluck</p>

          <p class="success-trust-note">
            🔒 Always shop on <strong>www.bisbam.com</strong> — the official Bisbam Hairs website.
          </p>
        `;
      }

      /* ============ NOT FOUND ============ */
      function renderNotFound() {
        card.innerHTML = `
          <p class="success-eyebrow">Bisbam Hairs · Lagos</p>
          <h1 class="success-title">Order Not Found</h1>
          <p class="success-script">Something's off</p>

          <div class="success-divider"></div>

          <p class="success-message">
            We couldn't find an order with that number. Please try again or message us for help.
          </p>

          <div class="success-actions">
            <a href="https://wa.me/2348146108122?text=${encodeURIComponent('Hi Bisbam Hairs, I need help with my order.')}"
               class="btn btn-primary" target="_blank" rel="noopener">
              Message us on WhatsApp
            </a>
            <a href="shop.html" class="btn btn-outline">Continue Shopping</a>
          </div>

          <p class="success-footer-note">Good Hairs Attract Goodluck</p>

          <p class="success-trust-note">
            🔒 Always shop on <strong>www.bisbam.com</strong> — the official Bisbam Hairs website.
          </p>
        `;
      }

      /* ============ ERROR ============ */
      function renderError(msg) {
        card.innerHTML = `
          <p class="success-eyebrow">Bisbam Hairs · Lagos</p>
          <h1 class="success-title">Something Went Wrong</h1>

          <div class="success-divider"></div>

          <p class="success-message">${msg}</p>

          <div class="success-actions">
            <a href="index.html" class="btn btn-primary">Back to Home</a>
            <a href="https://wa.me/2348146108122" class="btn btn-outline" target="_blank" rel="noopener">
              Message us on WhatsApp
            </a>
          </div>

          <p class="success-trust-note">
            🔒 Always shop on <strong>www.bisbam.com</strong> — the official Bisbam Hairs website.
          </p>
        `;
      }

      /* ============ WHATSAPP AUTO-REDIRECT ============ */
      function startWhatsAppRedirect(order) {
        const btn = document.getElementById('whatsappOrderBtn');
        const note = document.getElementById('whatsappNote');
        const countdownEl = document.getElementById('countdown');

        if (!btn) return;

        // Build message
        let msg = `Hi Bisbam Hairs! I just paid for my order.\n\n`;
        msg += `Order #: ${order.order_number}\n`;
        msg += `Name: ${order.customer_name || ''}\n\n`;

        msg += `Items:\n`;
        (order.items || []).forEach((item, i) => {
          const variant = [item.length && `${item.length}"`, item.texture, item.color, item.density]
            .filter(Boolean).join(' · ');
          const price = '₦' + Number(item.price * item.qty).toLocaleString('en-NG');
          msg += `${i + 1}. ${item.name}${variant ? ` (${variant})` : ''} × ${item.qty} — ${price}\n`;
        });

        msg += `\nTotal Paid: ₦${Number(order.total || 0).toLocaleString('en-NG')}\n\n`;
        msg += `Please confirm delivery. Thank you!`;

        const waUrl = `https://wa.me/2348146108122?text=${encodeURIComponent(msg)}`;
        btn.href = waUrl;

        // Show countdown
        if (note) note.classList.add('is-visible');

        let seconds = 4;
        const timer = setInterval(() => {
          seconds--;
          if (countdownEl) countdownEl.textContent = seconds;
          if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = waUrl;
          }
        }, 1000);
      }

      init();

    })();
  </script>

</body>
</html>
