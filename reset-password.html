<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Bisbam Hairs</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-card">

    <a href="index.html">
      <img src="assets/logo/logo.png" alt="Bisbam Hairs" class="auth-logo">
    </a>

    <h1 class="auth-title" id="resetTitle">Reset Password</h1>
    <p class="auth-subtitle" id="resetSubtitle">Set a new password for your account</p>

    <!-- Loading state -->
    <div id="resetLoading" style="text-align:center;padding:24px 0;color:var(--grey);font-size:0.9rem;">
      Verifying your reset link…
    </div>

    <!-- Reset form -->
    <form id="resetForm" style="display:none;">

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" minlength="6" autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="resetSubmitBtn">
        Save New Password
      </button>

    </form>

    <p class="auth-error" id="resetError" hidden></p>
    <p class="auth-success" id="resetSuccess" hidden></p>

    <p class="auth-footer-text" id="resetBackWrap" style="display:none;">
      <a href="auth.html">← Back to sign in</a>
    </p>

    <p class="auth-trust">
      🔒 Always shop on <strong>www.bisbam.com</strong> — the official Bisbam Hairs website.
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
